<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Haxmas Tree</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="header">
        <h1 class="important-text">Haxmas Tree</h1>
        <h2 id="date">December 19, 2025</h2>
    </div>
    <div id="tree-container" class="container">
        <div id="tree-wrapper">
            <div id="star">⭐</div>
            <div id="tree-css">
                <div class="tree-layer layer-1"></div>
                <div class="tree-layer layer-2"></div>
                <div class="tree-layer layer-3"></div>
                <div class="trunk"></div>
            </div>
            <div id="decorations"></div>
        </div>
    </div>
    <div id="land"></div>
    <div id="footer">
        <h3 class="important-text">by jai</h3>
    </div>

    <script src="script.js"></script>
</body>

</html>
